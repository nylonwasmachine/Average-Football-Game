
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Football Online</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      background: #101b16; color: white;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(100%, 420px); padding: 28px;
      background: #1b2b23; border: 1px solid #3b5847;
      border-radius: 18px;
    }
    h1 { margin-top: 0; }
    p { color: #b7c9bd; line-height: 1.5; }
    label { display: block; margin: 14px 0 6px; }
    input, button {
      width: 100%; padding: 12px; border-radius: 8px;
      font-size: 16px;
    }
    input {
      color: white; background: #101b16;
      border: 1px solid #52715d;
    }
    button {
      margin-top: 12px; border: 0;
      background: #78e29a; color: #102017;
      font-weight: bold; cursor: pointer;
    }
    button.secondary { background: #354b3d; color: white; }
    #message { overflow-wrap: anywhere; }
    #account { display: none; }
  </style>
</head>
<body>
<main>
  <h1>⚽ Football Online</h1>
  <p>Maak je account aan en speel straks online tegen andere spelers.</p>

  <section id="auth">
    <label for="username">Gebruikersnaam (bij registratie)</label>
    <input id="username" placeholder="FootballKing" maxlength="20"
      autocomplete="username">

    <label for="email">E-mailadres</label>
    <input id="email" type="email" autocomplete="email"
      placeholder="jij@example.com">

    <label for="password">Wachtwoord</label>
    <input id="password" type="password"
      autocomplete="current-password" placeholder="Minimaal 6 tekens">

    <button id="signup">Account aanmaken</button>
    <button id="login" class="secondary">Inloggen</button>
  </section>

  <section id="account">
    <h2 id="welcome">Welkom!</h2>
    <p>Je bent ingelogd. Je online voetbalprofiel is actief.</p>
    <button id="find" >Online spelen — volgende stap</button>
    <button id="logout" class="secondary">Uitloggen</button>
  </section>

  <p id="message" role="status" aria-live="polite"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // VUL DEZE TWEE WAARDEN IN VAN JOUW SUPABASE PROJECT
  const SUPABASE_URL = "PLAK_HIER_JE_PROJECT_URL";
  const SUPABASE_KEY = "PLAK_HIER_JE_PUBLISHABLE_KEY";

  const message = document.getElementById("message");
  const auth = document.getElementById("auth");
  const account = document.getElementById("account");
  const usernameInput = document.getElementById("username");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  function say(text) { message.textContent = text; }

  if (
    !window.supabase ||
    SUPABASE_URL.includes("https://qrsszzzvbuegeevweuwd.supabase.co") ||
    SUPABASE_KEY.includes("sb_publishable_x1mLlxqTBT6iJiLudFnyHQ_0aOyRVXM")
  ) {
    say("Vul eerst je Supabase Project URL en publishable key in de code in.");
  } else {
    const db = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    async function showSession(user) {
      auth.style.display = user ? "none" : "block";
      account.style.display = user ? "block" : "none";

      if (!user) return;

      const { data, error } = await db
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .maybeSingle();

      if (error) {
        say("Ingelogd, maar profiel laden lukte niet: " + error.message);
        return;
      }

      document.getElementById("welcome").textContent =
        "Welkom, " + (data?.username || "speler") + "!";
      say("Je bent ingelogd.");
    }

    document.getElementById("signup").onclick = async () => {
      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
        return say("Gebruikersnaam: 3–20 letters, cijfers of underscores.");
      }
      if (!email || password.length < 6) {
        return say("Vul je e-mailadres in en gebruik minimaal 6 tekens als wachtwoord.");
      }

      say("Account aanmaken...");
      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: { username },
          emailRedirectTo: window.location.href.split("?")[0]
        }
      });

      if (error) return say("Registratie mislukt: " + error.message);

      if (data.session) {
        await showSession(data.user);
      } else {
        say("Account aangemaakt! Controleer je e-mail en bevestig je account. Log daarna in.");
      }
    };

    document.getElementById("login").onclick = async () => {
      say("Inloggen...");
      const { data, error } = await db.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value
      });

      if (error) return say("Inloggen mislukt: " + error.message);
      await showSession(data.user);
    };

    document.getElementById("logout").onclick = async () => {
      const { error } = await db.auth.signOut();
      if (error) return say("Uitloggen mislukt: " + error.message);
      await showSession(null);
      say("Je bent uitgelogd.");
    };

    document.getElementById("find").onclick = () => {
      say("Account werkt! De volgende stap is kamercodes en matchmaking bouwen.");
    };

    db.auth.onAuthStateChange((_event, session) => {
      // Vermijd async databasewerk in deze callback.
      if (session) {
        auth.style.display = "none";
        account.style.display = "block";
        document.getElementById("welcome").textContent =
          "Welkom, " + (session.user.user_metadata?.username || "speler") + "!";
      } else {
        auth.style.display = "block";
        account.style.display = "none";
      }
    });

    db.auth.getSession().then(({ data, error }) => {
      if (error) say("Sessie laden mislukt: " + error.message);
      else showSession(data.session?.user ?? null);
    });
  }
</script>
</body>
</html>
